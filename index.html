<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A child-friendly English word choice quiz with audio, near-miss spellings, and adaptive hub progress support."
    />
    <title>English Word Choice Quiz</title>
    <script>document.documentElement.dataset.quizAccess = "checking";</script>
    <style>html[data-quiz-access="checking"] body { visibility: hidden; }</style>
    <noscript><meta http-equiv="refresh" content="0;url=https://ahmad9077.github.io/quizzes-hub/"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://ahmad9077.github.io/quizzes-hub/config.js?v=4"></script>
    <script src="https://ahmad9077.github.io/quizzes-hub/access-guard.js?v=2" data-quiz-id="english-word-choice"></script>
    <script src="https://ahmad9077.github.io/quizzes-hub/challenge-client.js?v=1"></script>
    <script>
      if (!new URLSearchParams(window.location.search).has("challenge_session")) {
        document.write('<script src="https://ahmad9077.github.io/quizzes-hub/progress-client.js?v=6"><\/script>');
        document.write('<script src="https://ahmad9077.github.io/quizzes-hub/adaptive-client.js?v=2"><\/script>');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
